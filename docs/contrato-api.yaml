openapi: 3.1.0
info:
  title: osi-back — Lab Modernización
  description: 'API de gestión de requerimientos de modernización tecnológica.


    **Cómo autenticarse:** ejecuta `POST /api/auth/login`, copia el `token` de la respuesta y pégalo en **Authorize**.
    El token dura 15 minutos.


    Cada endpoint indica el permiso que exige; sin él responde 403.'
  version: v1
servers:
- url: http://localhost:8091
  description: Generated server url
security:
- bearerAuth: []
paths:
  /api/requerimientos/{id}:
    get:
      tags:
      - requerimiento-controller
      operationId: obtener
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RequerimientoResponse'
    put:
      tags:
      - requerimiento-controller
      description: '**Permiso requerido:** `REQUERIMIENTO_MODIFICAR`'
      operationId: actualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequerimientoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RequerimientoResponse'
    delete:
      tags:
      - requerimiento-controller
      description: '**Permiso requerido:** `REQUERIMIENTO_ELIMINAR`'
      operationId: eliminar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
  /api/requerimientos/{id}/estimacion:
    put:
      tags:
      - estimacion-controller
      description: '**Permiso requerido:** `ESTIMACION_GUARDAR`'
      operationId: estimar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimacionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EstimacionResponse'
  /api/aplicaciones/{id}:
    get:
      tags:
      - aplicacion-controller
      operationId: obtener_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AplicacionResponse'
    put:
      tags:
      - aplicacion-controller
      description: '**Permiso requerido:** `CATALOGO_GESTIONAR`'
      operationId: actualizar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AplicacionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AplicacionResponse'
    delete:
      tags:
      - aplicacion-controller
      description: '**Permiso requerido:** `CATALOGO_GESTIONAR`'
      operationId: eliminar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
  /api/usuarios:
    get:
      tags:
      - usuario-controller
      description: '**Permiso requerido:** `USUARIO_ADMINISTRAR`'
      operationId: listar
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResponse'
    post:
      tags:
      - usuario-controller
      description: '**Permiso requerido:** `USUARIO_ADMINISTRAR`'
      operationId: registrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuarioRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
  /api/requerimientos:
    get:
      tags:
      - requerimiento-controller
      operationId: listar_1
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          type: string
          enum:
          - REGISTRADO
          - ESTIMADO
          - APROBADO
          - RECHAZADO
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequerimientoResponse'
    post:
      tags:
      - requerimiento-controller
      description: '**Permiso requerido:** `REQUERIMIENTO_CREAR`'
      operationId: crear
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequerimientoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RequerimientoResponse'
  /api/requerimientos/{id}/archivo:
    get:
      tags:
      - requerimiento-controller
      operationId: descargarArchivo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
    post:
      tags:
      - requerimiento-controller
      description: '**Permiso requerido:** `REQUERIMIENTO_MODIFICAR`'
      operationId: adjuntarArchivo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
              required:
              - archivo
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RequerimientoResponse'
  /api/auth/refresh:
    post:
      tags:
      - auth-controller
      summary: Renovar el access token
      description: Usa la cookie refresh_token (la envía el navegador) y la rota.
      operationId: refresh
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
      security: []
  /api/auth/logout:
    post:
      tags:
      - auth-controller
      summary: Cerrar sesión
      description: Revoca el refresh token y borra la cookie.
      operationId: logout
      responses:
        '200':
          description: OK
      security: []
  /api/auth/login:
    post:
      tags:
      - auth-controller
      summary: Iniciar sesión
      description: Devuelve el access token (JWT) y crea la cookie del refresh token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
      security: []
  /api/aplicaciones:
    get:
      tags:
      - aplicacion-controller
      operationId: listar_2
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AplicacionResponse'
    post:
      tags:
      - aplicacion-controller
      description: '**Permiso requerido:** `CATALOGO_GESTIONAR`'
      operationId: crear_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AplicacionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AplicacionResponse'
  /api/requerimientos/{id}/decision:
    patch:
      tags:
      - decision-controller
      description: '**Permiso requerido:** `REQUERIMIENTO_APROBAR`'
      operationId: decidir
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DecisionResponse'
  /api/requerimientos/{id}/auditoria:
    get:
      tags:
      - auditoria-controller
      description: '**Permiso requerido:** `AUDITORIA_VER`'
      operationId: historial
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditoriaResponse'
  /api/reportes/seguimiento:
    get:
      tags:
      - tablero-controller
      operationId: seguimiento
      parameters:
      - name: desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: aplicacion
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SeguimientoResponse'
  /api/estimaciones:
    get:
      tags:
      - tablero-controller
      operationId: bandeja
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequerimientoBandejaResponse'
  /api/dashboard/resumen:
    get:
      tags:
      - tablero-controller
      operationId: resumen
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DashboardResumenResponse'
  /api/auth/me:
    get:
      tags:
      - auth-controller
      summary: Usuario actual
      description: Datos, rol y permisos del usuario del token.
      operationId: me
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
  /api/auditoria:
    get:
      tags:
      - auditoria-controller
      description: '**Permiso requerido:** `AUDITORIA_VER`'
      operationId: buscar
      parameters:
      - name: desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: usuario
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditoriaResponse'
components:
  schemas:
    RequerimientoRequest:
      type: object
      properties:
        aplicacionId:
          type: integer
          format: int64
        titulo:
          type: string
          maxLength: 180
          minLength: 0
        descripcion:
          type: string
          maxLength: 2000
          minLength: 0
        prioridad:
          type: string
          enum:
          - BAJA
          - MEDIA
          - ALTA
        tipo:
          type: string
          maxLength: 50
          minLength: 0
        fechaRequerida:
          type: string
          format: date
        detalleTecnico:
          type: string
          maxLength: 2000
          minLength: 0
      required:
      - aplicacionId
      - descripcion
      - prioridad
      - titulo
    AplicacionResumen:
      type: object
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
    RequerimientoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        aplicacion:
          $ref: '#/components/schemas/AplicacionResumen'
        titulo:
          type: string
        descripcion:
          type: string
        prioridad:
          type: string
          enum:
          - BAJA
          - MEDIA
          - ALTA
        estado:
          type: string
          enum:
          - REGISTRADO
          - ESTIMADO
          - APROBADO
          - RECHAZADO
        tipo:
          type: string
        fechaRequerida:
          type: string
          format: date
        detalleTecnico:
          type: string
        archivoNombre:
          type: string
        creadoPor:
          type: string
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time
    EstimacionRequest:
      type: object
      properties:
        hhDesarrollo:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
      required:
      - hhDesarrollo
    EstimacionResponse:
      type: object
      properties:
        requerimientoId:
          type: integer
          format: int64
        codigo:
          type: string
        estado:
          type: string
        hhAnalisis:
          type: number
        hhDesarrollo:
          type: number
        hhPruebas:
          type: number
        hhDocumentacion:
          type: number
        hhTotal:
          type: number
    AplicacionRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 160
          minLength: 0
        descripcion:
          type: string
          maxLength: 500
          minLength: 0
        tecnologiaActual:
          type: string
          maxLength: 160
          minLength: 0
        tecnologiaObjetivo:
          type: string
          maxLength: 160
          minLength: 0
        activo:
          type: boolean
      required:
      - activo
      - descripcion
      - nombre
    AplicacionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        tecnologiaActual:
          type: string
        tecnologiaObjetivo:
          type: string
        activo:
          type: boolean
    RegistroUsuarioRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 80
          minLength: 3
          pattern: ^[A-Za-z0-9._-]+$
        password:
          type: string
          maxLength: 72
          minLength: 8
        rol:
          type: string
          enum:
          - ANALISTA
          - COORDINADOR
          - APROBADOR
      required:
      - password
      - rol
      - username
    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        rol:
          type: string
          enum:
          - ANALISTA
          - COORDINADOR
          - APROBADOR
        activo:
          type: boolean
        permisos:
          type: array
          items:
            type: string
            enum:
            - CATALOGO_VER
            - CATALOGO_GESTIONAR
            - REQUERIMIENTO_CREAR
            - REQUERIMIENTO_MODIFICAR
            - REQUERIMIENTO_ELIMINAR
            - ESTIMACION_GUARDAR
            - REQUERIMIENTO_APROBAR
            - AUDITORIA_VER
            - USUARIO_ADMINISTRAR
          uniqueItems: true
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        tipo:
          type: string
        expiraEn:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/UsuarioResponse'
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    DecisionRequest:
      type: object
      properties:
        decision:
          type: string
          enum:
          - APROBADO
          - RECHAZADO
        motivo:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - decision
    DecisionResponse:
      type: object
      properties:
        requerimientoId:
          type: integer
          format: int64
        codigo:
          type: string
        estado:
          type: string
        motivoRechazo:
          type: string
    AuditoriaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fecha:
          type: string
          format: date-time
        usuario:
          type: string
        operacion:
          type: string
        requerimientoCodigo:
          type: string
        detalle:
          type: string
    FilaAplicacion:
      type: object
      properties:
        aplicacion:
          type: string
        porEstado:
          type: object
          additionalProperties:
            type: integer
            format: int64
        hhAprobadas:
          type: number
    SeguimientoResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        porEstado:
          type: object
          additionalProperties:
            type: integer
            format: int64
        hhAprobadas:
          type: number
        porAplicacion:
          type: array
          items:
            $ref: '#/components/schemas/FilaAplicacion'
    RequerimientoBandejaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        titulo:
          type: string
        aplicacion:
          type: string
        prioridad:
          type: string
        estado:
          type: string
        hhTotal:
          type: number
        fechaRegistro:
          type: string
          format: date
        motivoRechazo:
          type: string
    DashboardResumenResponse:
      type: object
      properties:
        aplicaciones:
          type: integer
          format: int64
        requerimientos:
          type: integer
          format: int64
        porEstado:
          type: object
          additionalProperties:
            type: integer
            format: int64
        hhAprobadas:
          type: number
        porAplicacion:
          type: array
          items:
            $ref: '#/components/schemas/PorAplicacion'
    PorAplicacion:
      type: object
      properties:
        aplicacion:
          type: string
        cantidad:
          type: integer
          format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
