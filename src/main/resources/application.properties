spring.application.name=osinergmin

# 8080 lo ocupa nginx en desarrollo
server.port=${SERVER_PORT:8091}
# Nunca enviar el stack trace al cliente (devtools lo activa por defecto)
server.error.include-stacktrace=never

# Conexion a Oracle
spring.datasource.url=jdbc:oracle:thin:@//10.0.0.19:1521/bdsph01
spring.datasource.username=aprendizaje
spring.datasource.password=123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Las columnas de fecha son TIMESTAMP (sin zona): guardar los Instant así, siempre en UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Seguridad / JWT
# En producción definir JWT_SECRET (mínimo 32 caracteres) como variable de entorno.
app.jwt.secret=${JWT_SECRET:dev-secret-cambiar-en-produccion-0123456789abcdef}
app.jwt.expiration=${JWT_EXPIRATION:15m}
app.jwt.issuer=osi-back

# Refresh token (cookie HttpOnly, rotación en cada uso)
app.refresh.expiration=${REFRESH_EXPIRATION:7d}
app.refresh.reuse-grace=30s
app.refresh.cookie-name=refresh_token
# true = solo HTTPS (Chrome/Firefox lo aceptan también en http://localhost; Safari no)
app.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:true}

# Orígenes permitidos para el frontend (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Coordinador inicial (administra usuarios): solo se crea si ambas variables están definidas y no existe ningún COORDINADOR
app.admin-inicial.username=${ADMIN_USERNAME:}
app.admin-inicial.password=${ADMIN_PASSWORD:}
